glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: lint
      run: npx oxlint --fix {staged_files}
      glob: "**/*.{js,ts,astro}"
      stage_fixed: true
    - name: test-related
      run: npx vitest related --run --coverage=false {staged_files}
      glob: "**/*.{js,ts,astro}"

pre-push:
  jobs:
    - name: ci-checks
      run: |
        set -e
        # git sets repo-local variables for a hook; from a linked worktree they break the commands below
        unset $(git rev-parse --local-env-vars)
        actionlint
        npm run lint
        npm run typecheck
        npm test
        SOURCE_DIR=demo npm run build
        npm run test:e2e
