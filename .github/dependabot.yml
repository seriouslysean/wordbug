version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github_actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Held at TypeScript 6: astro check refuses TypeScript 7.0; Astro's TypeScript 7 support needs
      # 7.1+ with @astrojs/ts-content-mapper. Its architecture tests also use the TypeScript 6
      # compiler API, which 7 drops; pin that as a separate npm alias when this moves. Remove this
      # once that's supported.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
