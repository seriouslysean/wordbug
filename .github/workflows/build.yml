name: Build

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'npm'

      # Before setup-env, so no dependency's install script sees the secrets
      - name: Install dependencies
        run: npm ci

      # Only a push to main builds with Sentry and Google Analytics. A pull
      # request gets no secret, so its build has both off and uploads nothing,
      # and it is not tagged production.
      - name: Setup environment variables
        uses: ./.github/actions/setup-env
        with:
          vars-json: ${{ toJSON(vars) }}
          ga-enabled: ${{ github.event_name == 'push' && secrets.GA_ENABLED || '' }}
          ga-measurement-id: ${{ github.event_name == 'push' && secrets.GA_MEASUREMENT_ID || '' }}
          sentry-auth-token: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          sentry-dsn: ${{ github.event_name == 'push' && secrets.SENTRY_DSN || '' }}
          sentry-enabled: ${{ github.event_name == 'push' && secrets.SENTRY_ENABLED || '' }}
          sentry-environment: ${{ github.event_name == 'push' && 'production' || 'development' }}
          sentry-org: ${{ github.event_name == 'push' && secrets.SENTRY_ORG || '' }}
          sentry-project: ${{ github.event_name == 'push' && secrets.SENTRY_PROJECT || '' }}

      - run: npm run build
