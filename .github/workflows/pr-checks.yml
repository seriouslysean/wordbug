name: PR Checks

# Runs every check workflow on a pull request, then lets the Dependabot job
# merge once all of them pass. The check workflows also run on their own for
# pushes to main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  # Squash-merges a Dependabot PR once the jobs above pass, if every update is a
  # patch or minor (fastify/github-action-merge-dependabot, pinned to v3.15.0).
  # Majors and anything not Dependabot's stay open for a person.
  automerge:
    name: 'Dependabot auto-merge'
    needs: [build, e2e, lint, test, typecheck]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 'Merge minor and patch updates'
        id: merge
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          target: minor
          merge-method: squash
      # A merge made with GITHUB_TOKEN starts no workflows, so the push-to-main
      # deploy would not run. workflow_dispatch is exempt.
      - name: 'Deploy the merged change'
        if: steps.merge.outputs.merge_status == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main
