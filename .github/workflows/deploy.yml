name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

  # Add Word pushes with GITHUB_TOKEN, which starts no push run, so its
  # completion is the trigger. github.sha for workflow_run is the last commit
  # on the default branch, so the site checkout builds the pushed word.
  workflow_run:
    workflows: ['Add Word']
    branches: ['main']
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # The demo site deploys through the same workflow every site calls, from
  # this commit. The github-pages environment is on its deployment job.
  deploy:
    # completed includes failed and cancelled runs, which pushed nothing
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/site-deploy.yml
    secrets:
      site-secrets: ${{ toJSON(secrets) }}
