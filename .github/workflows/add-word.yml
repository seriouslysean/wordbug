name: Add Word

on:
  workflow_dispatch:
    inputs:
      word:
        description: 'The word to add'
        required: true
        type: string
      date:
        description: 'Date to add the word to (YYYYMMDD). Leave empty for today.'
        required: false
        type: string
      overwrite:
        description: 'Overwrite existing word if one exists for the date'
        required: false
        type: boolean
        default: false
      preserve_case:
        description: 'Keep original capitalization (for proper nouns, acronyms, or brands like "Japan", "NASA", "iPhone"). Needed for any entry a dictionary spells with a capital: the word is otherwise looked up in lowercase, and Wiktionary has "Japan" but not "japan"'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: add-word
  cancel-in-progress: false

jobs:
  # The demo site adds words through the same workflow every site calls,
  # from this commit
  add-word:
    uses: ./.github/workflows/site-add-word.yml
    with:
      word: ${{ inputs.word }}
      date: ${{ inputs.date }}
      overwrite: ${{ inputs.overwrite }}
      preserve_case: ${{ inputs.preserve_case }}
    secrets:
      MERRIAM_WEBSTER_API_KEY: ${{ secrets.MERRIAM_WEBSTER_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENABLED: ${{ secrets.SENTRY_ENABLED }}
