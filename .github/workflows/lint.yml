name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - run: npm run lint

  # Checks the workflows themselves, with .github/actionlint.yaml. Installs
  # nothing from npm, so it needs no Node.
  actionlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      # The digest GitHub records for the release's linux_amd64 archive
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$ARCHIVE" --dir "$RUNNER_TEMP"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" actionlint

      - name: Check workflow files
        run: |
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color
