name: Site Deploy

# Builds a site and deploys it to GitHub Pages. Deploy (deploy.yml) calls it
# with ./, in this repository for the demo site and in each downstream site,
# which is a full copy of this repository and so runs its own copy of both
# files at its own commit:
#
#   jobs:
#     deploy:
#       uses: ./.github/workflows/site-deploy.yml
#       secrets:
#         GA_ENABLED: ${{ secrets.GA_ENABLED }}
#         GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
#         SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
#         SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
#         SENTRY_ENABLED: ${{ secrets.SENTRY_ENABLED }}
#         SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
#         SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
#
# The code and the content are both the calling repository at the calling
# commit: its engine, and its data/ and public/. The steps run in that
# repository, with its variables, its GITHUB_TOKEN and its Pages site.

on:
  workflow_call:
    secrets:
      GA_ENABLED:
        description: 'Whether Google Analytics is enabled'
        required: false
      GA_MEASUREMENT_ID:
        description: 'Google Analytics measurement ID'
        required: false
      SENTRY_AUTH_TOKEN:
        description: 'Sentry auth token for build uploads'
        required: false
      SENTRY_DSN:
        description: 'Sentry data source name'
        required: false
      SENTRY_ENABLED:
        description: 'Whether Sentry is enabled'
        required: false
      SENTRY_ORG:
        description: 'Sentry organization'
        required: false
      SENTRY_PROJECT:
        description: 'Sentry project'
        required: false

permissions:
  contents: read

# The repository that builds the demo site. Not job.workflow_repository,
# which a downstream site's ./ call makes the site itself.
env:
  ENGINE_REPOSITORY: seriouslysean/occasional-wotd

jobs:
  build:
    runs-on: ubuntu-26.04
    # Usually under a minute; the slowest green Deploy took five. A release
    # that changes the cards re-renders every one of a site's.
    timeout-minutes: 15
    steps:
      # For workflow_run, github.sha is the last commit on the default branch,
      # so this builds the word Add Word just pushed
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: site
          persist-credentials: false

      # job.workflow_* name the repository and commit this workflow runs
      # from, and a caller passes nothing that names the engine. A ./ call
      # runs the workflow from the caller's own commit, so the engine is the
      # calling repository at that commit: this repository for the demo
      # site, a downstream site for its own.
      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: engine/.nvmrc
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      # Before setup-env, so no dependency's install script sees the secrets
      - name: Install dependencies
        working-directory: engine
        run: npm ci

      - name: Setup environment variables
        uses: ./engine/.github/actions/setup-env
        with:
          vars-json: ${{ toJSON(vars) }}
          ga-enabled: ${{ secrets.GA_ENABLED }}
          ga-measurement-id: ${{ secrets.GA_MEASUREMENT_ID }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-dsn: ${{ secrets.SENTRY_DSN }}
          sentry-enabled: ${{ secrets.SENTRY_ENABLED }}
          sentry-org: ${{ secrets.SENTRY_ORG }}
          sentry-project: ${{ secrets.SENTRY_PROJECT }}

      # site/ and engine/ are the same commit of the same repository, so the
      # copy changes nothing: a downstream site keeps the demo content it
      # tracks beside its own, and SOURCE_DIR decides which is built. Were
      # the two to differ, the site's data/ and public/ would replace the
      # engine's and the engine's favicon would stay when the site had none.
      # Everything runs from engine/, whose own .git gives the build its
      # release fingerprint.
      - name: Overlay site content
        run: |
          # This repository builds the demo site and every other repository
          # builds its own, so a wrong SOURCE_DIR would publish the other
          if [[ "$GITHUB_REPOSITORY" == "$ENGINE_REPOSITORY" ]]; then
            EXPECTED=demo
          else
            EXPECTED=
          fi
          if [[ "$SOURCE_DIR" != "$EXPECTED" ]]; then
            echo "::error::SOURCE_DIR must be '$EXPECTED' in $GITHUB_REPOSITORY. Set or clear it in the repository variables."
            exit 1
          fi

          # rsync --delete from a missing directory would empty the engine's
          WORDS_DIR="data/${SOURCE_DIR:+$SOURCE_DIR/}words"
          if [[ ! -d "site/$WORDS_DIR" || ! -d site/public ]]; then
            echo "::error::The site needs $WORDS_DIR and public."
            exit 1
          fi

          # rsync -a copies a link as a link, so the tools would write through
          # it, and the build read through it, outside engine/
          LINKS=$(find site/data site/public -type l)
          if [[ -n "$LINKS" ]]; then
            while IFS= read -r link; do
              echo "::error::${link#site/} is a symbolic link. A site's data and public hold only files and directories."
            done <<< "$LINKS"
            exit 1
          fi

          # --checksum compares content: two checkouts made in the same second
          # can hold a same-size file that rsync's size and time check skips
          rsync -a --checksum --delete site/data/ engine/data/
          rsync -a --checksum --delete --filter='P /favicon.svg' site/public/ engine/public/

      # Complete generation, so an engine or theme change never deploys stale
      # cards. Cards that are current are skipped, and nothing is committed.
      - name: Generate images
        working-directory: engine
        run: npm run tool:generate-images

      - name: Build
        working-directory: engine
        run: npm run build

      # With Sentry on, the build writes a source map beside each script,
      # uploads them and deletes them (astro.config.ts,
      # filesToDeleteAfterUpload: the same directory, the same *.js.map).
      # One left behind would be published with the site, so the deploy
      # stops instead. With Sentry off no map is generated.
      - name: Check for source maps
        working-directory: engine
        run: |
          # find fails on a missing directory, and no scripts means no maps
          if [[ ! -d dist/_astro ]]; then
            exit 0
          fi
          MAPS=$(find dist/_astro -name '*.js.map')
          if [[ -n "$MAPS" ]]; then
            while IFS= read -r map; do
              echo "::error::$map is a source map the build did not remove, and the deploy would publish it."
            done <<< "$MAPS"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: engine/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    # Above the 10 minutes deploy-pages waits for a deployment, so its own
    # timeout reports first
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # A job that calls a reusable workflow cannot name an environment, so the
    # deployment job here does
    environment:
      name: github-pages
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
